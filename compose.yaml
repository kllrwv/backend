name: killerwave-local
services:
  api:
    build: .
    env_file:
      - ./.env
    environment:
      DATABASE_URL: ${KILLERWAVE_DOCKER_DATABASE_URL:-postgres://killerwave:killerwave-local@postgres:5432/killerwave}
      API_BIND: 0.0.0.0:18080
      ADMIN_ORIGIN: http://localhost:3001
      LOCALIZATIONS_PATH: /app/translations.json
    ports:
      - "127.0.0.1:18080:18080"
    volumes:
      - type: bind
        source: ./translations.json
        target: /app/translations.json
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "3", "http://127.0.0.1:18080/api/health"]
      interval: 15s
      timeout: 4s
      retries: 5
      start_period: 10s
    init: true
    restart: unless-stopped
  admin:
    profiles: ["admin"]
    build:
      context: ${KILLERWAVE_ADMIN_DIR:-../admin}
    environment:
      KILLERWAVE_SOCIAL_ORIGIN: http://localhost:3000
    ports:
      - "127.0.0.1:3001:3000"
    restart: unless-stopped
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: killerwave
      POSTGRES_PASSWORD: killerwave-local
      POSTGRES_DB: killerwave
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U killerwave"]
      interval: 3s
      timeout: 3s
      retries: 15
  mail:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:11025:1025"
      - "127.0.0.1:18025:8025"
volumes:
  postgres:
