[package]
name = "killerwave-api"
version = "0.1.0"
edition = "2024"
license = "PolyForm-Noncommercial-1.0.0"
[dependencies]
anyhow = "1"
argon2 = "0.5"
aws-credential-types = "1.3.1"
aws-sigv4 = "1.6.6"
axum = { version = "0.8", features = ["multipart"] }
axum-extra = { version = "0.10", features = ["cookie"] }
base64 = "0.22"
data-encoding = "2.11"
dotenvy = "0.15"
flate2 = "1"
hmac = "0.12"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls", "ring", "webpki-roots"] }
phonenumber = "0.3"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring", "macros", "migrate", "uuid", "json"] }
subtle = "2"
time = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "sync"] }
uuid = { version = "1", features = ["v4", "serde"] }
[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["multipart"] }
